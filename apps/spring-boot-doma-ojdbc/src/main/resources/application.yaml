spring:
  main:
    banner-mode: off
    log-startup-info: false
  datasource:
    url: jdbc:oracle:thin:@//${BENCH_DB_HOST}:${BENCH_DB_PORT}/${BENCH_DB_NAME}
    username: ${BENCH_DB_USER}
    password: ${BENCH_DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 1
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 1
      validate-connection-on-borrow: true

doma:
  dialect: oracle
  jdbc-logger: slf4j

logging:
  level:
    org.seasar.doma.jdbc: warn
