<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDB RTT benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --canvas: #f2efe7;
  --panel: #fbf9f4;
  --sunk: #ece8dd;
  --raised: #ffffff;
  --ink: #29271f;
  --ink-2: #5d5a50;
  --muted: #8e8a7e;
  --line: #e0dbcd;
  --line-strong: #cbc4b2;
  --accent: #c15f3c;
  --accent-ink: #973f22;
  --accent-soft: #f5e3d8;
  --accent-faint: #faf0ea;
  --danger: #a32d2d;
  --danger-soft: #fbf0f0;
  --grid: #e8e3d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --row-1: #eda100;
  --row-2: #e87ba4;
  --row-3: #008300;
  --row-4: #4a3aa7;
  --row-5: #e34948;
  --shadow-1: 0 1px 2px rgba(58, 46, 24, .06), 0 0 0 1px rgba(58, 46, 24, .04);
  --shadow-2: 0 8px 28px rgba(58, 46, 24, .08), 0 1px 2px rgba(58, 46, 24, .06);
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --sans: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #1c1b19; --panel: #252421; --sunk: #2e2c28; --raised: #2f2d29; --ink: #f1eee5; --ink-2: #c8c3b5; --muted: #8f8a7d;
    --line: #37352f; --line-strong: #4a4740; --accent: #db7a52; --accent-ink: #f0a585; --accent-soft: #3d2a20; --accent-faint: #2f241e; --danger: #f08a8a; --danger-soft: #3a2424; --grid: #33312c;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --row-1: #c98500; --row-2: #d55181; --row-3: #008300; --row-4: #9085e9; --row-5: #e66767;
    --shadow-1: 0 0 0 1px rgba(255,255,255,.04); --shadow-2: 0 0 0 1px rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #1c1b19; --panel: #252421; --sunk: #2e2c28; --raised: #2f2d29; --ink: #f1eee5; --ink-2: #c8c3b5; --muted: #8f8a7d;
  --line: #37352f; --line-strong: #4a4740; --accent: #db7a52; --accent-ink: #f0a585; --accent-soft: #3d2a20; --accent-faint: #2f241e; --danger: #f08a8a; --danger-soft: #3a2424; --grid: #33312c;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --row-1: #c98500; --row-2: #d55181; --row-3: #008300; --row-4: #9085e9; --row-5: #e66767;
  --shadow-1: 0 0 0 1px rgba(255,255,255,.04); --shadow-2: 0 0 0 1px rgba(255,255,255,.05);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.7 var(--sans); }
button { font: inherit; color: inherit; }
.shell { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; height: 56px; }
.logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; font: 600 13px var(--serif); }
.title { font: 600 16px var(--serif); }
.chip { display: inline-flex; align-items: center; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
.topbar .sp { flex: 1; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 26px 0 22px; }
.hero h1 { font: 600 clamp(22px, 2.6vw, 30px)/1.45 var(--serif); margin: 0 0 6px; }
.hero p { margin: 0; color: var(--ink-2); max-width: 720px; }
.hero .lead { font-size: 16px; line-height: 1.8; color: var(--ink); }
.eq-title { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.axis-ctl { display: flex; align-items: center; gap: 10px; }
.axis-ctl .ctl-label { margin: 0; }
.count input { width: 52px; border: 0; border-left: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); border-radius: 0; text-align: center; padding: 3px 2px; background: var(--panel); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.count input::-webkit-inner-spin-button, .count input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.eq-card { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow-2); padding: 18px 26px; }
.eq { font: 600 clamp(26px, 3.6vw, 40px)/1.2 var(--serif); white-space: nowrap; }
.eq sub { font-size: .5em; }
.eq .n { color: var(--accent); }
.eq-legend { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.eq-legend b { font: 600 13px var(--serif); color: var(--ink); }
.eq-legend b.n { color: var(--accent-ink); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .eq { white-space: normal; } }

/* workbench */
.bench { display: grid; grid-template-columns: 360px 1fr; background: var(--panel); border-radius: 24px; box-shadow: var(--shadow-2); overflow: clip; margin-bottom: 40px; }
@media (max-width: 980px) { .bench { grid-template-columns: 1fr; } }
.pane { padding: 20px 22px 24px; min-width: 0; }
.pane.config { background: var(--sunk); border-right: 1px solid var(--line); }
@media (max-width: 980px) { .pane.config { border-right: 0; border-bottom: 1px solid var(--line); } }
.pane-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.step-no { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 12px var(--serif); flex: none; }
.pane-head h2 { font: 600 18px var(--serif); margin: 0; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }

/* config diagram */
.diagram { position: relative; padding-bottom: 6px; }
.diagram .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
.diagram .wires path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.bound { position: relative; border: 1.5px dashed var(--line-strong); border-radius: 16px; padding: 28px 12px 12px; }
.bound > .tag { position: absolute; top: 6px; left: 14px; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.ctr { position: relative; background: var(--panel); border: 1.5px solid var(--line-strong); border-radius: 14px; padding: 12px 46px 14px 12px; }
.ctr + .ctr { margin-top: 64px; }
.ctr .name { font: 600 13px var(--serif); margin-bottom: 8px; }
.frame { position: relative; border: 1px dashed var(--line-strong); border-radius: 12px; padding: 24px 8px 8px; display: grid; gap: 6px; }
.frame > .tag { position: absolute; top: 4px; left: 10px; font-size: 11px; color: var(--muted); }
.comp { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.comp label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.comp label + select { margin-bottom: 0; }
.comp select { width: 100%; }
.comp .gap { height: 8px; }
.down { height: 10px; position: relative; }
.down::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px solid var(--line-strong); }
.conns { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.conns i { width: 11px; height: 11px; border-radius: 50%; background: var(--series-1); opacity: .7; flex: none; }
.conns i.busy { background: var(--accent); opacity: 1; box-shadow: 0 0 0 3px var(--accent-soft); }
.nic { position: absolute; right: 12px; bottom: -17px; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 11px var(--sans); z-index: 6; box-shadow: 0 0 0 4px var(--sunk); }
.nic-note { position: absolute; right: 56px; bottom: -40px; font-size: 11.5px; color: var(--accent-ink); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 14px; font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; flex: none; }
.legend .l-conn { width: 10px; height: 10px; border-radius: 50%; background: var(--series-1); opacity: .7; }
.legend .l-busy { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.legend .l-nic { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
.legend .l-sql { width: 16px; height: 2px; background: var(--accent); }

/* step tabs */
.steps { display: flex; gap: 4px; align-items: stretch; box-shadow: inset 0 -1px 0 var(--line); margin: -4px 0 18px; overflow-x: auto; overflow-y: hidden; }
.stab { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 6px 14px 12px 4px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.stab .step-no { background: var(--line-strong); color: var(--panel); }
.stab .t { font: 600 17px var(--serif); }
.stab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.stab[aria-selected="true"] .step-no { background: var(--ink); }
.stab .chev { color: var(--line-strong); font-size: 18px; margin-left: 6px; }
.stab.minor { margin-left: auto; font-size: 13px; padding-left: 14px; }
.stab.minor + .stab.minor { margin-left: 0; }
.stab.minor .t { font: 400 13px var(--sans); }

/* control panel */
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; background: var(--canvas); border-radius: 16px; padding: 14px 18px 10px; margin-bottom: 16px; }
@media (max-width: 760px) { .controls { grid-template-columns: 1fr; } }
.ctl { min-width: 0; }
.ctl.wide { grid-column: 1 / -1; }
.ctl-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.ctl-label .val { font: 600 15px var(--serif); color: var(--ink); }
.ctl-label .val.off { color: var(--muted); font: 400 12px var(--sans); }
.row-ctl { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-1); }
.keyline { display: inline-flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.keyline span { display: inline-flex; align-items: center; gap: 6px; }
.keyline i { width: 18px; border-top: 2px solid var(--ink-2); }
.keyline i.dash { border-top-style: dashed; }
select, input[type=number] { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
select:disabled { color: var(--ink-2); background: var(--sunk); border-style: dashed; opacity: 1; cursor: not-allowed; }
.workload-select { min-width: 280px; font-size: 14px; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* stepped slider */
.stepper { position: relative; height: 46px; margin: 0 14px; touch-action: none; cursor: pointer; outline: none; user-select: none; }
.stepper .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.stepper .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--accent); }
.stepper .dot { position: absolute; top: 9px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line-strong); }
.stepper .dot.on { border-color: var(--accent); background: var(--accent); }
.stepper .lbl { position: absolute; top: 26px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.stepper .lbl.cur { color: var(--ink); font-weight: 600; }
.stepper .thumb { position: absolute; top: 4px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--canvas), 0 2px 6px rgba(0,0,0,.18); transition: left .12s ease; }
.stepper.dragging .thumb { transition: none; }
.stepper:focus-visible .thumb { box-shadow: 0 0 0 4px var(--canvas), 0 0 0 6px var(--accent); }
.stepper.disabled { cursor: default; }
.stepper.disabled .fill, .stepper.disabled .thumb { display: none; }
.stepper.disabled .dot { border-style: dashed; }
.stepper.locked { cursor: default; }
.stepper .dot.na { background: transparent; border-style: dashed; border-color: var(--line-strong); opacity: .7; }
.stepper .lbl.na { color: var(--line-strong); text-decoration: line-through; }

/* simulation list */
.query-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--raised); }
.query { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sp { flex: 1; }
.count { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; background: var(--panel); }
.count button { border: 0; background: transparent; width: 28px; height: 28px; cursor: pointer; font-size: 15px; color: var(--ink-2); }
.count button:hover { background: var(--sunk); color: var(--ink); }
.query.one { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.query.one .query-workload { flex: 1 1 220px; }
.query.one > select:not(.query-workload) { width: 120px; }
.x { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 1; }
.x:hover { background: var(--danger-soft); color: var(--danger); }
.scenario-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.scenario-bar select { min-width: 260px; font-size: 14px; }
.dirty { font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 1px 10px; }
.link-btn { border: 0; background: transparent; color: var(--accent-ink); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
.md td, .md th { padding: 8px 8px; }
.md .grp td { border-top: 1.5px solid var(--line-strong); }
.md .pid { font-weight: 500; }
.md td.ratio { font-weight: 600; }
.md td.ratio { color: #2f6b1f; }
.md td.ratio.off { color: var(--danger); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .md td.ratio:not(.off) { color: #7fcf6a; } }
:root[data-theme="dark"] .md td.ratio:not(.off) { color: #7fcf6a; }
.md td.pid { white-space: nowrap; }
.md th sub, .md td sub { font-size: .75em; }
.that { position: relative; display: inline-block; }
.that::after { content: ""; position: absolute; left: 50%; top: -.08em; width: .34em; height: .34em; border-top: .09em solid currentColor; border-left: .09em solid currentColor; transform: translateX(-50%) rotate(45deg); }
.md th { vertical-align: bottom; line-height: 1.4; }
.md .fixed { color: var(--muted); }
.trace { overflow-x: auto; background: var(--canvas); border-radius: 16px; padding: 14px 16px 6px; }
.trace svg { display: block; width: 100%; min-width: 640px; height: auto; }
.trace .lane { fill: var(--ink-2); font: 12px var(--sans); }
.trace .st { fill: var(--ink-2); font: 12px var(--sans); }
.trace .st.in { fill: #fff; font-weight: 600; }
.trace .grid { stroke: var(--line-strong); stroke-width: 1; }
.trace .band { fill: var(--accent-faint); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
.trace .brace { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.trace .brace-t { fill: var(--accent-ink); font: 600 13px var(--sans); }
.trace .sp { stroke-width: 1; }
.trace .sp.out { fill: none; stroke: var(--line-strong); stroke-dasharray: 4 3; }
.trace .sp.in { fill: var(--accent); stroke: var(--accent); }
.trace .sp.bd { fill: var(--accent-soft); stroke: var(--accent); }
.trace .st.bd { fill: var(--accent-ink); font-weight: 600; }
.trace .sp.jd { fill: var(--raised); stroke: var(--line-strong); }
.trace .sp.net { fill: var(--raised); stroke: var(--series-1); }
.trace .st.dlt { fill: var(--accent-ink); font-weight: 600; }
.trace .sp.db { fill: var(--sunk); stroke: var(--line-strong); }
.trace .dl { fill: url(#hatch); stroke: var(--accent); stroke-width: 1; }
.trace .h-bg { fill: var(--accent-soft); }
.trace .h-ln { stroke: var(--accent); stroke-width: 2; }
.trace .axis { stroke: var(--muted); stroke-width: 1.2; }
.trace .axis-h { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.tr-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 2px 0; font-size: 12px; color: var(--ink-2); }
.tr-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tr-legend i { width: 16px; height: 11px; border-radius: 3px; display: inline-block; }
.tr-legend .l-in { background: var(--accent); }
.tr-legend .l-bd { background: var(--accent-soft); border: 1px solid var(--accent); }
.tr-legend .l-out { border: 1px dashed var(--line-strong); }
.tr-legend .l-dl { background: repeating-linear-gradient(45deg, var(--accent-soft) 0 3px, var(--accent) 3px 5px); border: 1px solid var(--accent); }
.tr-legend .l-net { border: 1px solid var(--series-1); background: var(--raised); }
.tr-legend .l-db { border: 1px solid var(--line-strong); background: var(--sunk); }
.cond th { width: 9em; vertical-align: top; }
.code { margin: 0; padding: 12px 14px; background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; font: 12.5px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); overflow-x: auto; white-space: pre; }
.code .kw { color: var(--accent-ink); font-weight: 600; }
.file { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 2px 6px; border-radius: 6px; cursor: pointer; font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-2); }
.file:hover { background: var(--sunk); color: var(--accent-ink); }
.file .dl-ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.share-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 6px; }
.add-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--accent-ink); padding: 9px; cursor: pointer; font-size: 13px; }
.add-row:hover { background: var(--accent-faint); }
.tx { margin-bottom: 10px; }
.tx-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tx-title { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tx-head .x { margin-left: auto; }
.tx .query-list { border: 0; border-radius: 0; }
.add-tx { border: 1px dashed var(--line-strong); border-radius: 14px; margin-bottom: 16px; }

/* figures */
.chart { position: relative; height: 380px; }
.foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 500; background: var(--panel); position: sticky; top: 0; z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.scroll { overflow-x: auto; }
.sub-h { font: 600 14px var(--serif); margin: 0 0 8px; }
.cap { color: var(--muted); font-size: 12px; margin: 0; }

/* dialog */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(1080px, 96vw); max-width: 96vw; max-height: 88vh; overflow: hidden; background: var(--panel); color: var(--ink); box-shadow: 0 24px 70px rgba(30, 22, 10, .3); }
dialog::backdrop { background: rgba(35, 30, 20, .45); }
.dlg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font: 600 16px var(--serif); flex: 1 1 260px; }
.dlg-body { padding: 14px 20px 20px; overflow: auto; max-height: calc(88vh - 70px); }
.ctx { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 14px; font-size: 13px; }
.ctx dt { color: var(--muted); }
.ctx dd { margin: 0; color: var(--ink); }
.dlg-table { max-height: 58vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }


.warn { color: var(--accent-ink); font-size: 12.5px; margin: 0 0 10px; white-space: pre-line; }
.dlg-table thead { position: sticky; top: 0; z-index: 1; }
.dlg-table thead th { position: static; }
.dlg-table th.group { text-align: center; border-bottom: 1px solid var(--line); }
.dlg-table .g-start { border-left: 1px solid var(--line); }
.dlg-table tr.has-failure td { background: var(--danger-soft); color: var(--danger); }
.dlg-table tr.on-chart td { font-weight: 600; }
.dlg-table tr.on-chart td:first-child { box-shadow: inset 3px 0 0 var(--ink-2); }

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="logo">Δ</div><div class="title">rdb-rtt-benchmark</div>
    <span class="sp"></span>
    <span class="chip" id="name-chip" hidden></span>
  </header>

  <section class="hero">
    <div>
      <h1 data-i18n="app.title"></h1>
      <p class="lead" data-i18n-html="hero.lead"></p>
    </div>
    <div class="eq-card" role="figure" aria-labelledby="eq-title">
      <div class="eq-title" id="eq-title" data-i18n="eq.title"></div>
      <div class="eq">T = T<sub>0</sub> + <span class="n">n</span> × ΔRTT</div>
      <div class="eq-legend">
        <b>T<sub>0</sub></b><span data-i18n="eq.t0"></span>
        <b class="n">n</b><span data-i18n="eq.n"></span>
        <b>ΔRTT</b><span data-i18n="eq.drtt"></span>
      </div>
    </div>
  </section>


  <main class="bench">
    <aside class="pane config" aria-labelledby="h-config">
      <div class="pane-head"><span class="step-no">1</span><h2 id="h-config" data-i18n="config.title"></h2></div>
      <p class="hint" data-i18n="config.hint"></p>
      <div class="diagram" id="diagram">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div class="bound"><span class="tag" data-i18n="diagram.host"></span>
          <div class="bound"><span class="tag" data-i18n="diagram.vm"></span>
            <div class="ctr">
              <div class="name" data-i18n="diagram.appContainer"></div>
              <div class="frame"><span class="tag" data-i18n="diagram.testApp"></span>
                <div class="comp"><label for="c-fw" data-i18n="diagram.framework"></label><select id="c-fw" disabled></select></div>
                <div class="down" aria-hidden="true"></div>
                <div class="comp"><label for="c-da" data-i18n="diagram.dataAccess"></label><select id="c-da" disabled></select></div>
                <div class="down" aria-hidden="true"></div>
                <div class="comp">
                  <label for="c-pool" data-i18n="diagram.pool"></label><select id="c-pool"></select>
                  <div class="gap"></div>
                  <label for="c-drv" data-i18n="diagram.driver"></label><select id="c-drv" disabled></select>
                  <div class="conns" data-i18n-aria="diagram.connections"><span data-i18n="diagram.connections"></span><i class="busy" id="conn-busy"></i></div>
                </div>
              </div>
              <div class="nic" id="nic">NIC</div>
              <div class="nic-note" data-i18n="diagram.nicNote"></div>
            </div>
            <div class="ctr">
              <div class="name" data-i18n="diagram.dbContainer"></div>
              <div class="comp" id="db-comp"><label for="c-db" data-i18n="diagram.database"></label><select id="c-db"></select></div>
              <div class="down" aria-hidden="true"></div>
              <div class="comp" data-i18n="diagram.schema"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="legend"><span><i class="l-conn"></i><span data-i18n="legend.connection"></span></span><span><i class="l-busy"></i><span data-i18n="legend.busy"></span></span><span><i class="l-nic"></i><span data-i18n="legend.nic"></span></span><span><i class="l-sql"></i><span data-i18n="legend.sql"></span></span></div>
    </aside>

    <section class="pane">
      <div class="steps" role="tablist">
        <button class="stab" role="tab" aria-selected="true" data-tab="result"><span class="step-no">2</span><span class="t" data-i18n="tab.result"></span><span class="chev" aria-hidden="true">›</span></button>
        <button class="stab" role="tab" aria-selected="false" data-tab="sim"><span class="step-no">3</span><span class="t" data-i18n="tab.sim"></span></button>
        <button class="stab minor" role="tab" aria-selected="false" data-tab="workload"><span class="t" data-i18n="tab.workload"></span></button>
        <button class="stab minor" role="tab" aria-selected="false" data-tab="model"><span class="t" data-i18n="tab.model"></span></button>
        <button class="stab minor" role="tab" aria-selected="false" data-tab="cond"><span class="t" data-i18n="tab.cond"></span></button>
      </div>
      <p class="warn" id="run-warn" hidden></p>

      <!-- 2. Results -->
      <div class="tabpanel" data-panel="result">
        <div class="controls">
          <div class="ctl wide"><div class="ctl-label" data-i18n="ctl.workload"></div><div class="row-ctl"><select id="r-workload" class="workload-select" data-i18n-aria="ctl.workload"></select><button class="link-btn" id="r-show-workload" data-i18n="ctl.showWorkload"></button></div></div>
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.rows"></span><span class="val" id="v-rows"></span></div><div class="stepper" id="s-rows" data-i18n-aria="ctl.rows"></div></div>
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.delta"></span><span class="val" id="v-delta"></span></div><div class="stepper" id="s-delta" aria-label="ΔRTT"></div></div>
          <div class="ctl wide row-ctl"><div class="axis-ctl"><span class="ctl-label" data-i18n="ctl.axis"></span><div class="seg" id="r-axis" role="group" data-i18n-aria="ctl.axis"><button data-v="rows" data-i18n="ctl.axisRows"></button><button data-v="delay" data-i18n="ctl.axisDelta"></button></div></div><span class="keyline" id="r-key"><span><i></i><span data-i18n="key.selected"></span></span><span><i class="dash"></i><span data-i18n="key.zero"></span></span></span></div>
        </div>
        <div class="chart"><canvas id="ch-result"></canvas></div>
        <div class="foot"><button class="btn" data-open="result" data-i18n="btn.viewData"></button></div>
      </div>

      <!-- 3. Scenario simulation -->
      <div class="tabpanel" data-panel="sim" hidden>
        <div class="scenario-bar">
          <span class="ctl-label" style="margin:0" data-i18n="sim.scenario"></span>
          <select id="sim-scenario" data-i18n-aria="sim.scenario"></select>
          <span class="dirty" id="sim-dirty" data-i18n="sim.dirty" hidden></span>
          <button class="link-btn" id="sim-reset" data-i18n="sim.reset" hidden></button>
        </div>
        <p class="warn" id="sim-warn" hidden></p>
        <div id="scenario-txs"></div>
        <button class="add-row add-tx" id="tx-add" data-i18n="tx.add"></button>
        <div class="controls">
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.rows"></span><span class="val off" data-i18n="ctl.perSql"></span></div><div class="stepper" id="s-simrows" data-i18n-aria="ctl.rows"></div></div>
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.delta"></span><span class="val" id="v-simdelta"></span></div><div class="stepper" id="s-simdelta" aria-label="ΔRTT"></div></div>
          <div class="ctl wide row-ctl"><div class="axis-ctl"><span class="ctl-label" data-i18n="ctl.axis"></span><div class="seg" role="group" data-i18n-aria="ctl.axis"><button disabled aria-pressed="false" data-i18n="ctl.axisRows"></button><button aria-pressed="true" data-i18n="ctl.axisDelta"></button></div></div></div>
        </div>
        <div class="share-head" style="margin-top:4px"><h3 class="sub-h" style="margin:0" data-i18n="sim.total"></h3><span class="cap" id="v-boundary"></span></div>
        <div class="chart"><canvas id="ch-sim"></canvas></div>
        <div class="share-head"><h3 class="sub-h" style="margin:0" data-i18n="sim.share"></h3><span class="cap" id="v-share"></span></div>
        <div class="chart" style="height:220px"><canvas id="ch-share"></canvas></div>
      </div>

      <!-- Workloads -->
      <div class="tabpanel" data-panel="workload" hidden>
        <div class="controls" style="grid-template-columns:1fr">
          <div class="ctl"><div class="ctl-label" data-i18n="ctl.workload"></div><select id="w-workload" class="workload-select" data-i18n-aria="ctl.workload"></select></div>
        </div>
        <div class="share-head" style="margin-top:14px"><h3 class="sub-h" style="margin:0" data-i18n="workload.sql"></h3><button class="file" data-save="query.sql">query.sql<svg class="dl-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg></button></div>
        <pre class="code" id="w-query"></pre>
        <div class="share-head"><h3 class="sub-h" style="margin:0" data-i18n="workload.schema"></h3><button class="file" data-save="schema.sql">schema.sql<svg class="dl-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg></button></div>
        <pre class="code" id="w-schema"></pre>
        <div class="share-head"><h3 class="sub-h" style="margin:0" data-i18n="workload.data"></h3><button class="file" data-save="data.sql">data.sql<svg class="dl-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg></button></div>
        <pre class="code" id="w-data"></pre>
        <p class="cap" id="w-data-more" style="margin-top:6px"></p>
      </div>

      <!-- Measurement conditions -->
      <div class="tabpanel" data-panel="cond" hidden>
        <div class="share-head" style="margin-top:0"><h3 class="sub-h" style="margin:0" data-i18n="range.title"></h3></div>
        <div class="trace">
          <svg viewBox="0 0 1000 334" role="img" aria-labelledby="tr-title tr-desc">
            <title id="tr-title" data-i18n="range.svgTitle"></title>
            <desc id="tr-desc" data-i18n="range.svgDesc"></desc>
            <defs>
              <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="h-bg"/><line x1="0" y1="0" x2="0" y2="6" class="h-ln"/></pattern>
              <marker id="tr-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" class="axis-h"/></marker>
            </defs>
            <text class="brace-t" x="551" y="16" text-anchor="middle" data-i18n="range.tx"></text>
            <path class="brace" d="M212 32 V24 H890 V32"/>
            <g transform="translate(0 34)">
            <text class="lane" x="10" y="74" data-i18n="range.laneApp"></text>
            <text class="lane" x="10" y="122" data-i18n="range.laneJdbc"></text>
            <text class="lane" x="10" y="172" data-i18n="range.laneNet"></text>
            <text class="lane" x="10" y="222" data-i18n="range.laneDb"></text>
            <line class="grid" x1="166" y1="48" x2="166" y2="240"/>
            <rect class="band" x="212" y="40" width="148" height="200" rx="8"/>
            <rect class="band" x="402" y="40" width="298" height="200" rx="8"/>
            <rect class="band" x="742" y="40" width="148" height="200" rx="8"/>
            <path class="brace" d="M212 34 V26 H360 V34"/>
            <path class="brace" d="M402 34 V26 H700 V34"/>
            <path class="brace" d="M742 34 V26 H890 V34"/>
            <text class="brace-t" x="286" y="18" text-anchor="middle">acquire</text>
            <text class="brace-t" x="551" y="18" text-anchor="middle" data-i18n="range.brace"></text>
            <text class="brace-t" x="816" y="18" text-anchor="middle">commit</text>
            <rect class="sp out" x="172" y="56" width="38" height="26" rx="5"/><text class="st" x="191" y="74" text-anchor="middle" data-i18n="range.stats"></text>
            <rect class="sp bd" x="216" y="56" width="140" height="26" rx="5"/><text class="st bd" x="286" y="74" text-anchor="middle">acquire</text>
            <rect class="sp out" x="362" y="56" width="38" height="26" rx="5"/><text class="st" x="381" y="74" text-anchor="middle" data-i18n="range.stats"></text>
            <rect class="sp in" x="406" y="56" width="290" height="26" rx="5"/><text class="st in" x="551" y="74" text-anchor="middle" data-i18n="range.dao"></text>
            <rect class="sp out" x="702" y="56" width="38" height="26" rx="5"/><text class="st" x="721" y="74" text-anchor="middle" data-i18n="range.stats"></text>
            <rect class="sp bd" x="746" y="56" width="140" height="26" rx="5"/><text class="st bd" x="816" y="74" text-anchor="middle">commit</text>
            <rect class="sp out" x="892" y="56" width="38" height="26" rx="5"/><text class="st" x="911" y="74" text-anchor="middle" data-i18n="range.stats"></text>
            <g id="tr-fetches"></g>
            <line class="axis" x1="166" y1="262" x2="985" y2="262" marker-end="url(#tr-ah)"/>
            <text class="st" x="985" y="284" text-anchor="end" data-i18n="range.time"></text>
            </g>
          </svg>
        </div>
        <div class="tr-legend"><span><i class="l-in"></i><span data-i18n="range.lgIn"></span></span><span><i class="l-bd"></i><span data-i18n="range.lgBd"></span></span><span><i class="l-out"></i><span data-i18n="range.lgOut"></span></span><span><i class="l-dl"></i><span data-i18n="range.lgDelay"></span></span><span><i class="l-net"></i><span data-i18n="range.lgNet"></span></span><span><i class="l-db"></i><span data-i18n="range.lgDb"></span></span></div>
        <div class="scroll" style="margin-top:14px"><table id="range-table" class="cond"></table></div>
        <div class="share-head"><h3 class="sub-h" style="margin:0" data-i18n="cond.title"></h3></div>
        <div class="scroll"><table id="cond-table" class="cond"></table></div>
      </div>

      <!-- Model validation -->
      <div class="tabpanel" data-panel="model" hidden>
        <div class="controls">
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.rows"></span><span class="val" id="v-mrows"></span></div><div class="stepper" id="s-mrows" data-i18n-aria="ctl.rows"></div></div>
          <div class="ctl"><div class="ctl-label"><span data-i18n="ctl.delta"></span><span class="val" id="v-mdelta"></span></div><div class="stepper" id="s-mdelta" aria-label="ΔRTT"></div></div>
        </div>
        <div class="share-head" style="margin-top:4px"><h3 class="sub-h" style="margin:0" data-i18n-html="model.tableTitle"></h3><span class="cap" data-i18n-html="model.formula"></span></div>
        <div class="scroll"><table id="md-table" class="md"></table></div>
        <div class="share-head"><h3 class="sub-h" style="margin:0" data-i18n-html="model.parityTitle"></h3></div>
        <div class="chart"><canvas id="ch-parity"></canvas></div>
      </div>
    </section>
  </main>

</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><h3 id="dlg-title"></h3><button class="btn" id="dlg-csv" data-i18n="dlg.csv"></button><button class="btn primary" id="dlg-close" data-i18n="dlg.close"></button></div>
  <div class="dlg-body"><dl class="ctx" id="dlg-ctx"></dl><div class="dlg-table"><table id="dlg-table"></table></div></div>
</dialog>

<script>
'use strict';
// The renderer embeds the measurements, their test configurations, and the text of one language in #report-data.
const REPORT = JSON.parse(document.getElementById('report-data').textContent);

// ===== i18n =====
const L = REPORT.i18n;
// A key with a ".one" variant uses it when vars.n is 1 (for example, "1 row" in English).
const t = (k, vars = {}) => String((vars.n == 1 && L[`${k}.one`]) || (L[k] ?? k)).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-save]').forEach(el => el.setAttribute('aria-label', t('workload.save', { file: el.dataset.save })));
}

// ===== Common =====
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = ['--series-1', '--series-2', '--series-3', '--series-4'];
const nf = (v, d = 1) => Number(v).toLocaleString(L.locale, { maximumFractionDigits: d, minimumFractionDigits: d });
const int = v => Number(v).toLocaleString(L.locale);
const ms = v => v >= 1000 ? t('unit.s', { v: nf(v / 1000, 2) }) : t('unit.ms', { v: nf(v, v < 10 ? 2 : 1) });
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const q = (a, x) => { const s = [...a].sort((u, v) => u - v); const i = (s.length - 1) * x, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); };
const kk = (...a) => a.join('|');

// ===== Data =====
const MEASUREMENT = REPORT.measurement, WORKLOADS = REPORT.workloads, SCENARIOS = REPORT.scenarios;
const ROWS = MEASUREMENT.rows_axis, FETCH = MEASUREMENT.fetch_sizes, DELAYS = MEASUREMENT.delays_ms, REPEATS = MEASUREMENT.repeats;
const DSTEPS = DELAYS.some(x => x > 0) ? DELAYS.filter(x => x > 0) : [...DELAYS];
const W = id => WORKLOADS.find(w => w.id === id);
const workloadLabel = w => w ? w.name : '';
let CONFIG, AGG = new Map(), BOUNDARIES = new Map();

// results: { workloadId: [[rows, fetchSize, delayMs, queryMs, queryRoundtrips, acquireMs, acquireRoundtrips, commitMs,
// commitRoundtrips], ...] }. A failed measurement has null values.
// The query uses medians. Acquire and commit use means: a scenario adds them as the expected value per transaction.
const mean = a => a.reduce((sum, v) => sum + v, 0) / a.length;
const BOUNDARY_FIELDS = ['acquire', 'acquireRt', 'commit', 'commitRt'];
function aggregate(results) {
  const agg = new Map();
  for (const [workload, list] of Object.entries(results)) for (const [rows, fetch, delay, elapsed, rt, ...boundary] of list) {
    const k = kk(workload, rows, fetch, delay);
    if (!agg.has(k)) agg.set(k, { workload, rows, fetch, delay, runs: [], rts: [], boundaries: [], failed: 0 });
    const a = agg.get(k);
    if (elapsed == null) { a.failed++; continue; }
    a.runs.push(elapsed); a.rts.push(rt); a.boundaries.push(boundary);
  }
  for (const a of agg.values()) if (a.runs.length) {
    a.med = q(a.runs, .5); a.p95 = q(a.runs, .95); a.min = Math.min(...a.runs); a.max = Math.max(...a.runs); a.roundtrips = Math.round(q(a.rts, .5));
    BOUNDARY_FIELDS.forEach((field, i) => { a[field] = mean(a.boundaries.map(b => b[i])); });
  }
  return agg;
}
// Acquire and commit do not depend on the query, so each ΔRTT has one mean over every measurement at that ΔRTT.
function boundaries(agg) {
  const byDelay = new Map();
  for (const a of agg.values()) for (const b of a.boundaries) {
    if (!byDelay.has(a.delay)) byDelay.set(a.delay, []);
    byDelay.get(a.delay).push(b);
  }
  return new Map([...byDelay].map(([d, list]) => [d, Object.fromEntries(BOUNDARY_FIELDS.map((field, i) => [field, mean(list.map(b => b[i]))]))]));
}
const agg = (w, r, f, d) => AGG.get(kk(w, r, f, d));
const val = (w, r, f, d) => agg(w, r, f, d)?.med;
// Points whose value is missing (not measured, or every execution failed) are left out of the lines.
const pts = list => list.filter(pt => pt.y != null && !Number.isNaN(pt.y));

// ===== Charts =====
const charts = {}, DATA = {};
function opts(xTitle, yTitle) {
  const ink2 = css('--ink-2'), grid = css('--grid'), muted = css('--muted');
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
      legend: { labels: { color: ink2, usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, font: { family: css('--sans') }, filter: it => !it.text.startsWith('_') } },
      tooltip: { backgroundColor: css('--panel'), titleColor: css('--ink'), bodyColor: ink2, borderColor: css('--line-strong'), borderWidth: 1, padding: 10, cornerRadius: 10, filter: it => !it.dataset.label.startsWith('_m') },
    },
    scales: {
      x: { type: 'linear', ticks: { color: muted }, grid: { color: grid }, border: { color: css('--line-strong') }, title: { display: true, text: xTitle, color: ink2 } },
      y: { ticks: { color: muted }, grid: { color: grid }, border: { display: false }, title: { display: !!yTitle, text: yTitle, color: ink2 } },
    },
  };
}
const draw = (id, conf) => { charts[id]?.destroy(); charts[id] = new Chart($(id), conf); };
const line = (label, data, col, dash) => ({ type: 'line', label, data: pts(data), borderColor: dash ? col + '99' : col, backgroundColor: col, borderWidth: 2, pointRadius: dash ? 2.5 : 4, pointHoverRadius: 6, borderDash: dash ? [5, 4] : [] });
const marker = (x, top) => ({ type: 'line', label: '_marker', data: [{ x, y: 0 }, { x, y: top }], borderColor: css('--accent'), borderDash: [3, 3], borderWidth: 1.5, pointRadius: 0 });
const tipLabel = it => `${it.dataset.label.replace(/^_/, '')}: ${ms(it.parsed.y)}`;
const workloadOptions = current => WORKLOADS.map(w => `<option value="${esc(w.id)}" ${w.id === current ? 'selected' : ''}>${esc(workloadLabel(w))}</option>`).join('');
// Logarithmic axes label only 1, 3, 10, 30, ... so that labels near each other do not overlap.
function logAxes(o) {
  for (const axis of [o.scales.x, o.scales.y]) {
    axis.type = 'logarithmic';

// ===== Stepped slider (stops only at measured values; values that are not measured are greyed out) =====
function stepper(el, onChange) {

  el.setAttribute('role', 'slider');
  const pos = i => s.values.length < 2 ? 0 : i / (s.values.length - 1) * 100;
  const okIdx = () => s.values.map((_, i) => i).filter(i => s.ok[i]);
  s.render = () => {
    const on = !s.disabled;
    el.innerHTML = '<div class="track"></div><div class="fill"></div>' +
      s.values.map((v, i) => `<div class="dot ${!s.ok[i] ? 'na' : on && i <= s.i ? 'on' : ''}" style="left:${pos(i)}%"></div><div class="lbl ${!s.ok[i] ? 'na' : on && i === s.i ? 'cur' : ''}" style="left:${pos(i)}%">${s.fmt(v)}</div>`).join('') +
      '<div class="thumb"></div>';
    el.querySelector('.fill').style.width = `${pos(s.i)}%`;
    el.querySelector('.thumb').style.left = `${pos(s.i)}%`;
    const locked = s.disabled || okIdx().length < 2;
    el.classList.toggle('disabled', s.disabled); el.classList.toggle('locked', locked);
    el.setAttribute('aria-disabled', locked); el.tabIndex = locked ? -1 : 0;

  s.set = i => { i = nearest(i); if (i === s.i) return; s.i = i; s.render(); onChange(); };
  s.step = dir => { const list = okIdx(), k = list.indexOf(s.i) + dir; if (k >= 0 && k < list.length) s.set(list[k]); };
  s.value = () => s.values[s.i];
  s.config = (values, ok, fmt, initial) => { const want = initial ?? s.values[s.i]; s.values = values; s.ok = values.map(v => ok.includes(v)); if (fmt) s.fmt = fmt; s.i = nearest(Math.max(0, values.indexOf(want))); s.render(); };
  const idxAt = x => { const r = el.getBoundingClientRect(); return Math.round(Math.max(0, Math.min(1, (x - r.left) / r.width)) * (s.values.length - 1)); };
  el.addEventListener('pointerdown', e => { if (el.classList.contains('locked')) return; el.setPointerCapture(e.pointerId); el.classList.add('dragging'); el.focus(); s.set(idxAt(e.clientX)); });
  el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) s.set(idxAt(e.clientX)); });

}

      <rect class="sp net" x="${b + 46}" y="156" width="28" height="26" rx="5"/><text class="st" x="${b + 60}" y="174" text-anchor="middle">${esc(t('range.out'))}</text>
      <rect class="sp db" x="${b + 76}" y="206" width="32" height="26" rx="5"/><text class="st" x="${b + 92}" y="224" text-anchor="middle">${esc(t('range.proc'))}</text>
      <rect class="sp net" x="${b + 110}" y="156" width="28" height="26" rx="5"/><text class="st" x="${b + 124}" y="174" text-anchor="middle">${esc(t('range.back'))}</text>`;
  const calls = [[216, t('range.validate')], [408, 'fetch 1'], [554, 'fetch 2'], [746, 'commit']];
  $('tr-fetches').innerHTML = calls.map(([x, label]) => `<rect class="sp jd" x="${x}" y="106" width="140" height="26" rx="5"/><text class="st" x="${x + 70}" y="124" text-anchor="middle">${esc(label)}</text>
      ${roundTrip(x + 1)}`).join('');
  const condRows = rows => rows.map(([k, v]) => `<tr><th style="position:static">${esc(k)}</th><td style="white-space:normal">${esc(v)}</td></tr>`).join('');
  $('range-table').innerHTML = condRows([
    ['acquire', t('range.acquireDesc')],
    [t('range.t'), t('range.tDesc')],
    ['commit', t('range.commitDesc')],
    [t('range.outside'), t('range.outsideDesc')],
    [t('range.n'), t('range.nDesc')],
    [t('range.stat'), t('range.statDesc')],
  ]);
  const m = MEASUREMENT, dp = CONFIG.configuration.database_parameters ?? {};
  $('cond-table').innerHTML = condRows([
    [t('cond.run'), t('cond.runDesc', { id: m.name, at: new Date(m.started_at).toLocaleString(L.locale), end: m.finished_at ? new Date(m.finished_at).toLocaleString(L.locale) : '—' })],
    [t('cond.delay'), MEASUREMENT.delay.method === 'netem' ? t('cond.delayNetem') : t('cond.delayNone')],
    ...(MEASUREMENT.delay.command ? [[t('cond.delayCommand'), MEASUREMENT.delay.command]] : []),
    [t('cond.cache'), t('cond.cacheDesc')],
    [t('cond.connection'), t('cond.connectionDesc')],
    ...(dp.result_cache_mode ? [[t('cond.resultCache'), t('cond.resultCacheDesc', { mode: dp.result_cache_mode, size: dp.client_result_cache_size })]] : []),
    [t('cond.repeats'), t('cond.repeatsDesc', { n: REPEATS })],
    [t('cond.warmups'), t('cond.warmupsDesc', { n: MEASUREMENT.warmups })],
    [t('cond.delta'), t('unit.ms', { v: DSTEPS.join(t('list.separator')) })],
  ]);
}

// ===== Model validation =====
const sMRows = stepper($('s-mrows'), () => renderModel());
const sMDelta = stepper($('s-mdelta'), () => renderModel());
const num = v => v == null ? '—' : nf(v, v < 10 ? 2 : 1);
const tm = (w, r, f, d) => { const a = agg(w, r, f, 0); return a?.runs.length ? a.med + a.roundtrips * d : null; };
function renderModel() {
  const r0 = sMRows.value(), d = sMDelta.value();
  $('v-mrows').textContent = t('unit.rows', { n: int(r0) });
  $('v-mdelta').textContent = t('unit.ms', { v: d });
  const rowsOf = w => w.rows.includes(r0) ? r0 : w.rows.reduce((b, v) => Math.abs(v - r0) < Math.abs(b - r0) ? v : b, w.rows[0]);
  $('md-table').innerHTML = `<tr><th>${esc(t('model.colWorkload'))}</th><th class="n">${t('model.colRows')}</th><th class="n">ΔRTT</th><th class="n">fetchSize</th><th class="n">T<sub>0</sub></th><th class="n">n</th><th class="n">T</th><th class="n"><span class="that">T</span></th><th class="n">T ÷ <span class="that">T</span></th></tr>` +
    WORKLOADS.map(w => FETCH.map((f, j) => {
      const r = rowsOf(w), a0 = agg(w.id, r, f, 0), t0 = a0?.med, n = a0?.roundtrips, tt = val(w.id, r, f, d), m = tm(w.id, r, f, d);
      const ratio = tt != null && m ? tt / m : null;
      return `<tr class="${j === 0 ? 'grp' : ''}"><td class="pid">${j === 0 ? esc(workloadLabel(w)) : ''}</td><td class="n ${r !== r0 ? 'fixed' : ''}" title="${r !== r0 ? esc(t('model.fixed')) : ''}">${int(r)}</td><td class="n">${d}</td><td class="n">${f}</td><td class="n">${num(t0)}</td><td class="n">${n == null ? '—' : int(n)}</td><td class="n">${num(tt)}</td><td class="n">${num(m)}</td><td class="n ratio ${ratio == null || Math.abs(ratio - 1) > 0.1 ? 'off' : ''}">${ratio == null ? '—' : nf(ratio, 2)}</td></tr>`;
    }).join('')).join('');
  const all = [...AGG.values()].filter(a => a.delay > 0 && a.runs.length && agg(a.workload, a.rows, a.fetch, 0)?.runs.length);
  const ds = WORKLOADS.map((w, i) => ({ type: 'scatter', label: workloadLabel(w), pointRadius: 3, backgroundColor: css(SERIES[i % SERIES.length]) + 'aa', pointStyle: ['circle', 'rect', 'triangle'][i % 3],
    data: all.filter(a => a.workload === w.id).map(a => ({ x: tm(a.workload, a.rows, a.fetch, a.delay), y: a.med })) }));
  const xs = ds.flatMap(s => s.data.flatMap(pt => [pt.x, pt.y]));
  if (xs.length) {
    const lo = Math.min(...xs) * .8, hi = Math.max(...xs) * 1.2;
    ds.push({ type: 'line', label: t('model.identity'), data: [{ x: lo, y: lo }, { x: hi, y: hi }], borderColor: css('--muted'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 });
  }
  const o = opts(t('model.xAxis'), t('model.yAxis'));
  logAxes(o);
  o.plugins.tooltip.callbacks = { label: it => t('model.tip', { label: it.dataset.label, x: ms(it.parsed.x), y: ms(it.parsed.y) }) };
  draw('ch-parity', { data: { datasets: ds }, options: o });
}

// ===== Tabs and dialog =====
document.querySelectorAll('.stab').forEach(tb => tb.addEventListener('click', () => {
  document.querySelectorAll('.stab').forEach(x => x.setAttribute('aria-selected', x === tb));
  document.querySelectorAll('.tabpanel').forEach(panel => { panel.hidden = panel.dataset.panel !== tb.dataset.tab; });
  renderAll();
}));
let current = null;
const fmtCell = (c, v) => Number.isInteger(v) ? int(v) : c.trim ? v.toLocaleString(L.locale, { maximumFractionDigits: 2 }) : nf(v, 2);
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
  current = DATA[b.dataset.open]; if (!current) return;
  $('dlg-title').textContent = current.title;
  $('dlg-ctx').innerHTML = current.context.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  const cols = current.columns;
  const isNumber = c => current.rows.some(r => typeof r[c.key] === 'number');
  const starts = (c, i) => c.group && c.group !== cols[i - 1].group ? 'g-start' : '';
  const th = (c, i, attrs = '') => `<th class="${isNumber(c) ? 'n' : ''} ${starts(c, i)}" ${attrs}>${esc(c.label)}</th>`;
  const top = cols.map((c, i) => !c.group ? th(c, i, 'rowspan="2"')
    : starts(c, i) ? `<th class="group g-start" colspan="${cols.filter(x => x.group === c.group).length}">${esc(c.group)}</th>` : '').join('');
  const bottom = cols.map((c, i) => c.group ? th(c, i) : '').join('');
  // Keys that start with "_" mark rows and are not shown.
  $('dlg-table').innerHTML = `<thead><tr>${top}</tr><tr>${bottom}</tr></thead><tbody>` +
    current.rows.map(r => `<tr class="${r._failed ? 'has-failure' : ''} ${r._onChart ? 'on-chart' : ''}">${cols.map((c, i) => typeof r[c.key] === 'number' ? `<td class="n ${starts(c, i)}">${fmtCell(c, r[c.key])}</td>` : `<td class="${starts(c, i)}">${esc(r[c.key])}</td>`).join('')}</tr>`).join('') + '</tbody>';
  $('dlg').showModal();
}));
$('dlg-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('dlg-csv').addEventListener('click', () => {
  // The CSV repeats the context (test configuration, workload, repetitions) on every line, so that one file is self-contained.
  // A column in a group is named after both, such as "acquire Mean (ms)".
  const labels = current.columns.map(c => c.group ? `${c.group} ${c.label}` : c.label);
  const ctx = current.context.filter(([k]) => !labels.includes(k));
  const cell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const text = [[...ctx.map(([k]) => k), ...labels].map(cell).join(','),
    ...current.rows.map(r => [...ctx.map(([, v]) => v), ...current.columns.map(c => typeof r[c.key] === 'number' ? +r[c.key].toFixed(4) : r[c.key])].map(cell).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = `${CONFIG.id}.csv`; a.click();
});

// ===== Start =====
function initControls() {
  const resultWorkload = $('r-workload').value, shownWorkload = $('w-workload').value;
  const defaultWorkload = [...WORKLOADS].sort((a, b) => b.rows.length - a.rows.length)[0];
  $('r-workload').innerHTML = workloadOptions(W(resultWorkload) ? resultWorkload : defaultWorkload.id);
  $('w-workload').innerHTML = workloadOptions(W(shownWorkload) ? shownWorkload : WORKLOADS[0].id);
  sRows.config(ROWS, W($('r-workload').value).rows, fmtRows, sRows.values.length ? undefined : 1000);
  sDelta.config(DSTEPS, DSTEPS, fmtDelay, sDelta.values.length ? undefined : 2);
  sSim.config(DSTEPS, DSTEPS, fmtDelay, sSim.values.length ? undefined : 2);
  sSimRows.config(ROWS, ROWS, fmtRows, 1); sSimRows.disabled = true; sSimRows.render();
  sMRows.config(ROWS, ROWS, fmtRows, sMRows.values.length ? undefined : 1000);
  sMDelta.config(DSTEPS, DSTEPS, fmtDelay, sMDelta.values.length ? undefined : 2);
}
function renderAll() {
  if (!CONFIG) return;
  const tab = document.querySelector('.stab[aria-selected="true"]').dataset.tab;
  if (tab === 'result') renderResult(); else if (tab === 'sim') renderSim(); else if (tab === 'model') renderModel(); else if (tab === 'workload') renderWorkloadTab(); else if (tab === 'cond') renderCond();
  drawWires();
}

applyI18n();
$('name-chip').textContent = MEASUREMENT.name; $('name-chip').hidden = false;
$('sim-scenario').innerHTML = SCENARIOS.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
$('sim-scenario').disabled = !SCENARIOS.length;
if (SCENARIOS.length) loadScenario(SCENARIOS[0].id);
fillConfigSelects();
onConfigChange();
new ResizeObserver(drawWires).observe($('diagram'));
document.fonts?.ready.then(drawWires);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);

</script>
</body>
</html>
